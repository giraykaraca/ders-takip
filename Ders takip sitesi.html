    :root {

      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1050px; margin: 0 auto; }
    
    header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 24px; color: var(--text); font-weight: 700; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    
    .overall-progress { background: var(--card-bg); padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border); min-width: 250px; }
    .progress-bar-bg { background: #334155; height: 10px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* Akıllı Haftalık Özet Paneli */
    .smart-dashboard {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .dash-title { font-size: 16px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .dash-date { font-size: 13px; color: #cbd5e1; background: rgba(56, 189, 248, 0.15); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
    
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .dash-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .dash-card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
    .dash-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dash-item:last-child { border-bottom: none; }
    
    .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 9px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }

    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .tab-btn.exam-tab-btn { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .tab-btn.exam-tab-btn.active { background: var(--danger); color: #ffffff; border-color: var(--danger); }
    .tab-btn.schedule-tab-btn { border-color: rgba(56, 189, 248, 0.4); color: #7dd3fc; }
    .tab-btn.schedule-tab-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }

    .course-panel { display: none; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
    .course-panel.active { display: block; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
    .panel-title { font-size: 18px; font-weight: 600; color: var(--accent); }
    
    .exam-badge-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .exam-badge-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 2px; }
    .exam-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .exam-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .tag-midterm { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .tag-final { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-quiz { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    
    .topic-list { display: flex; flex-direction: column; gap: 10px; }
    .topic-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 8px; transition: all 0.15s; }
    .topic-item:hover { background: rgba(255, 255, 255, 0.04); border-color: #475569; }
    .topic-item.completed { background: rgba(34, 197, 94, 0.05); border-color: rgba(34, 197, 94, 0.3); }
    .topic-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--success); cursor: pointer; }
    .topic-info { flex: 1; }
    .week-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
    .inline-exam-flag { background: rgba(239, 68, 68, 0.2); color: #f87171; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .topic-title { font-size: 14px; line-height: 1.4; color: var(--text); }
    .topic-item.completed .topic-title { text-decoration: line-through; color: var(--text-muted); }

    /* Tablo Tasarımları */
    .custom-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .custom-table th { background: rgba(15, 23, 42, 0.6); padding: 12px 14px; color: var(--text-muted); border-bottom: 2px solid var(--border); }
    .custom-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .custom-table tr:hover { background: rgba(255, 255, 255, 0.02); }

    /* Kartlar */
    .schedule-card {
      background: rgba(15, 23, 42, 0.6);

      padding: 8px 10px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
    }
    .schedule-card.lab { border-left-color: var(--purple); }
    .schedule-card.theory { border-left-color: var(--accent); }
    .schedule-card.ps { border-left-color: var(--warning); }
    .schedule-title { font-weight: 700; font-size: 12px; color: var(--text); }
    .schedule-loc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .schedule-time { font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 3px; }
    .schedule-badge {

      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      background: rgba(168, 85, 247, 0.2);

      border-radius: 8px;
      font-size: 12px;
      color: #fde68a;
      line-height: 1.5;
    }
  </style>
</head>

    function initSmartDashboard() {
      const now = new Date();
      // Tarih formatı YYYY-MM-DD
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayISO = `${yyyy}-${mm}-${dd}`;

      const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
      const dayKeys = ["pazar", "pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi"];
      const currentDayName = dayNames[now.getDay()];
      const currentDayKey = dayKeys[now.getDay()];

      // Haftanın Pazartesi ve Pazar sınırlarını bul
      const currentDay = now.getDay();
      const diffToMonday = (currentDay === 0 ? -6 : 1) - currentDay; // Pazartesi
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday);
      monday.setHours(0, 0, 0, 0);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);

      const formatDateShort = (d) => `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
      
      document.getElementById('current-date-info').innerText = `Bugün: ${dd}.${mm}.${yyyy} (${currentDayName}) | Hafta: ${formatDateShort(monday)} – ${formatDateShort(sunday)}`;
      document.getElementById('today-day-label').innerText = currentDayName;

      // 1. Bugünkü Dersler
      const todayClassesElem = document.getElementById('today-classes-list');
      const todaySchedule = weeklySchedule[currentDayKey] || [];
      if (todaySchedule.length === 0) {
        todayClassesElem.innerHTML = `<div style="font-size:13px; color:var(--text-muted); padding:6px 0;">🎉 Bugün kayıtlı dersiniz yok! Dinlenme veya çalışma günü.</div>`;
      } else {
        todayClassesElem.innerHTML = todaySchedule.map(c => `
          <div class="dash-item">
            <div>
              <strong style="color:var(--accent);">${c.code}</strong>
              <div style="font-size:11px; color:var(--text-muted);">${c.name} (${c.loc})</div>
            </div>
            <div style="font-weight:600; font-size:12px; white-space:nowrap;">${c.time}</div>
          </div>
        `).join('');
      }

      // 2. Bu Haftanın Lab Durumu
      const labsListElem = document.getElementById('this-week-labs-list');
      let labEventsThisWeek = [];

      chemLabDates.forEach(l => {
        const lDate = new Date(l.dateStr);
        if (lDate >= monday && lDate <= sunday) {
          labEventsThisWeek.push({ name: "CHEM 113 (Grup A)", detail: l.exp, dateDisplay: l.dateStr, time: "Pzt 13:30 - 15:30" });
        }
      });

      physLabDates.forEach(l => {
        const lDate = new Date(l.dateStr);
        if (lDate >= monday && lDate <= sunday) {
          labEventsThisWeek.push({ name: "PHYS LAB I", detail: l.exp, dateDisplay: l.dateStr, time: "Perş 08:30" });
        }
      });

      if (labEventsThisWeek.length === 0) {
        labsListElem.innerHTML = `
          <div style="font-size:12px; color:var(--text-muted); padding:6px 0;">
            Bu hafta programınızda <strong style="color:var(--text);">Kimya (Grup A)</strong> veya <strong style="color:var(--text);">Fizik</strong> laboratuvar oturumu bulunmuyor (Dönüşümlü boş hafta).
          </div>
        `;
      } else {
        labsListElem.innerHTML = labEventsThisWeek.map(l => `
          <div class="dash-item">
            <div>
              <span style="font-weight:700; color:var(--purple);">${l.name}</span>
              <div style="font-size:11px; color:var(--text); margin-top:2px;">🔬 ${l.detail}</div>
            </div>
            <div style="font-size:11px; color:var(--text-muted); text-align:right;">${l.time}</div>
          </div>
        `).join('');
      }

      // 3. Bu Haftaki Sınavlar
      const examsListElem = document.getElementById('this-week-exams-list');
      const weekExams = examSchedule.filter(e => {
        if (!e.dateStr) return false;
        const eDate = new Date(e.dateStr);
        return eDate >= monday && eDate <= sunday;
      });

      document.getElementById('this-week-exam-count').innerText = `${weekExams.length} Sınav / Teslim`;

      if (weekExams.length === 0) {
        examsListElem.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:6px 0;">✅ Bu hafta planlanmış herhangi bir vize, quiz veya sınav bulunmuyor.</div>`;
      } else {
        examsListElem.innerHTML = weekExams.map(e => `
          <div class="dash-item">
            <div>
              <span style="font-weight:700; color:var(--danger);">${e.code}</span>
              <span style="font-size:11px; color:var(--text-muted);">(${e.type})</span>
              <div style="font-size:11px; color:var(--text);">${e.name}</div>
            </div>
            <div style="font-size:11px; color:var(--accent); text-align:right; white-space:nowrap;">
              <strong>${e.dateDisplay}</strong><br>${e.time}
            </div>
          </div>
        `).join('');
      }
    }

    function saveState() {
      localStorage.setItem('study_tracker_data', JSON.stringify(checkedState));

    function updateProgress() {
      let total = 0, completed = 0;
      Object.keys(courseData).forEach(code => {
        let courseTotal = courseData[code].topics.length;
        let courseDone = 0;
        courseData[code].topics.forEach((_, idx) => {
          total++;
          if (checkedState[`${code}_${idx}`]) {
            completed++;
            courseDone++;
          }
        });
        const coursePercentElem = document.getElementById(`pct-${code.replace(/\s+/g, '')}`);
        if (coursePercentElem) {
          coursePercentElem.innerText = `${Math.round((courseDone / courseTotal) * 100)}%`;
        }
      });
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('overall-percentage').innerText = `${pct}% (${completed}/${total})`;
      document.getElementById('overall-fill').style.width = `${pct}%`;
    }

      if (course.exams && course.exams.length > 0) {
        let tagHtml = course.exams.map(e => `<span class="exam-tag ${e.class}">${e.text}</span>`).join('');
        examsHeaderHtml = `
          <div class="exam-badge-box">
            <div class="exam-badge-title">Bu Dersin Sınav Tarihleri</div>
            <div class="exam-tags">${tagHtml}</div>
          </div>
        `;
      }

      let topicsHtml = course.topics.map((t, idx) => {
        const isChecked = !!checkedState[`${code}_${idx}`];
        return `
          <div class="topic-item ${isChecked ? 'completed' : ''}" id="item-${safeId}-${idx}">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTopic('${code}', ${idx}, this.checked)">
            <div class="topic-info">
              <div class="week-tag">
                <span>${t.week}</span>
                ${t.examNote ? `<span class="inline-exam-flag">⚠️ ${t.examNote}</span>` : ''}
              </div>
              <div class="topic-title">${t.title}</div>
            </div>
          </div>
        `;
      }).join('');

      panel.innerHTML = `
        <div class="panel-header">
          <div>
            <div class="panel-title">${code}: ${course.name}</div>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: var(--accent);" id="pct-${safeId}">0%</div>
        </div>
        ${examsHeaderHtml}
        <div class="topic-list">${topicsHtml}</div>
      `;
      panelsContainer.appendChild(panel);
    });

    window.toggleTopic = function(courseCode, idx, isChecked) {
      const safeId = courseCode.replace(/\s+/g, '');
      checkedState[`courseCode_${idx}`] = isChecked;
      const elem = document.getElementById(`item-${safeId}-${idx}`);
      if (isChecked) {
        elem.classList.add('completed');
      } else {
        elem.classList.remove('completed');
      }
      saveState();
    };

    // Başlangıç fonksiyonları
    initSmartDashboard();
    updateProgress();
  </script>
</body>
</html>
