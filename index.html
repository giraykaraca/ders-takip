<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DersTakip">
  <title>Ders & Sınav Takibi</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #a855f7;
      --bottom-bar-height: 64px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: max(env(safe-area-inset-top), 12px);
      padding-bottom: calc(var(--bottom-bar-height) + env(safe-area-inset-bottom) + 16px);
      padding-left: 14px;
      padding-right: 14px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Üst Başlık & İlerleme Çubuğu */
    header {
      margin-bottom: 14px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
    }
    .progress-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .progress-bar-bg {
      background: #1e293b;
      height: 6px;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Akıllı Asistan Widget */
    .smart-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }
    .smart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .smart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .smart-date {
      font-size: 11px;
      color: var(--text-muted);
    }
    .today-class-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .today-class-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .today-class-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .today-class-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Ders Yatay Filtre Çubuğu (Pill Selector) */
    .course-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .course-filter-bar::-webkit-scrollbar { display: none; }
    .course-pill {
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .course-pill.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Sayfa Görünümleri */
    .view-panel {
      display: none;
    }
    .view-panel.active {
      display: block;
    }

    /* Hafta Kartları (Program Görünümü) */
    .day-group {
      margin-bottom: 14px;
    }
    .day-heading {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      padding-left: 2px;
    }
    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .schedule-card.lab { border-left-color: var(--purple); }
    .schedule-card.theory { border-left-color: var(--accent); }
    .schedule-card.ps { border-left-color: var(--warning); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .card-code {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .card-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .card-name {
      font-size: 12px;
      color: #cbd5e1;
    }
    .card-loc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Sınav Kartları */
    .exam-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .exam-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
    }
    .badge-midterm { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .badge-final { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .badge-quiz { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    /* Konu Takip Öğeleri */
    .topic-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .topic-card.completed {
      background: rgba(34, 197, 94, 0.08);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .topic-card input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--success);
      margin-top: 1px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .topic-content {
      flex: 1;
    }
    .topic-week {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .topic-title {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text);
    }
    .topic-card.completed .topic-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Alt Navigasyon Çubuğu (Bottom Tab Bar) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--bottom-bar-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .bottom-nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .bottom-nav-item.active {
      color: var(--accent);
    }
    .bottom-nav-icon {
      font-size: 18px;
    }
    .bottom-nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
  </style>
</head>

        topics: [
          { week: "1. Hafta", title: "Technical Drawing intro" },
          { week: "2. Hafta", title: "CAD basics & orthographic" },
          { week: "3. Hafta", title: "2D Drawing Representation" },
          { week: "4. Hafta", title: "Conceptual design P1" },
          { week: "5. Hafta", title: "3D part design" },
          { week: "6. Hafta", title: "Sectional Views" },
          { week: "7. Hafta", title: "Midterm 1" },
          { week: "8. Hafta", title: "Dimensioning & tolerancing" },
          { week: "9. Hafta", title: "Assemblies & modeling" },
          { week: "10. Hafta", title: "Term project delivery" }
        ]
      }
    };

    let checkedState = JSON.parse(localStorage.getItem('study_tracker_data') || '{}');

    function saveState() {
      localStorage.setItem('study_tracker_data', JSON.stringify(checkedState));
      updateProgress();
    }

    function updateProgress() {
      let total = 0, completed = 0;
      Object.keys(courseData).forEach(code => {
        const topics = courseData[code].topics;
        topics.forEach((_, idx) => {
          total++;
          if (checkedState[`${code}_${idx}`]) completed++;
        });
      });
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
      document.getElementById('overall-percentage').innerText = `${pct}%`;
      document.getElementById('overall-fill').style.width = `${pct}%`;
    }

    // Alt Menü Geçişi
    function switchMainTab(targetViewId, btnElem) {
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(targetViewId).classList.add('active');
      btnElem.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Akıllı Asistanı Doldur
    function renderSmartCard() {
      const now = new Date();
      const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
      const dayKeys = ["pazar", "pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi"];
      const todayKey = dayKeys[now.getDay()];
      const todayName = dayNames[now.getDay()];

      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById('dash-date-text').innerText = `${dd}.${mm} (${todayName})`;

      const listElem = document.getElementById('smart-content-list');
      const todayGroup = weeklyDays.find(d => d.key === todayKey);

      if (!todayGroup || todayGroup.classes.length === 0) {
        listElem.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">Bugün dersin yok, dinlenme veya tekrar günü! 🌴</div>`;
        return;
      }

      listElem.innerHTML = todayGroup.classes.map(c => `
        <div class="today-class-item">
          <div>
            <div class="today-class-title">${c.code}</div>
            <div class="today-class-sub">${c.name} • 📍 ${c.loc}</div>
          </div>
          <div class="today-class-time">${c.time}</div>
        </div>
      `).join('');
    }

    // 1. Program Görünümünü Çiz
    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      container.innerHTML = weeklyDays.map(d => `
        <div class="day-group">
          <div class="day-heading">${d.name}</div>
          ${d.classes.map(c => `
            <div class="schedule-card ${c.type}">
              <div class="card-top">
                <span class="card-code">${c.code}</span>
                <span class="card-time">${c.time}</span>
              </div>
              <div class="card-name">${c.name}</div>
              <div class="card-loc">📍 ${c.loc}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // 2. Sınav Takvimini Çiz
    function renderExams() {
      const container = document.getElementById('exams-container');
      container.innerHTML = examSchedule.map(s => `
        <div class="exam-card">
          <div>
            <div style="font-weight:700;font-size:13px;color:var(--text);">${s.code}</div>
            <div style="font-size:11px;color:var(--text-muted);">${s.displayDate} • ${s.time}</div>
            <span class="exam-badge ${s.badge}">${s.type}</span>
          </div>
        </div>
      `).join('');
    }

    // 3. Konu Takibini Çiz
    let activeCourse = Object.keys(courseData)[0];
    function renderTopics() {
      const pillsContainer = document.getElementById('course-pills');
      pillsContainer.innerHTML = Object.keys(courseData).map(code => `
        <button class="course-pill ${code === activeCourse ? 'active' : ''}" onclick="selectCourse('${code}')">
          ${code}
        </button>
      `).join('');

      const listContainer = document.getElementById('course-topics-container');
      const course = courseData[activeCourse];
      listContainer.innerHTML = course.topics.map((t, idx) => {
        const isChecked = !!checkedState[`${activeCourse}_${idx}`];
        return `
          <div class="topic-card ${isChecked ? 'completed' : ''}" onclick="toggleTopicCard('${activeCourse}', ${idx})">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTopic('${activeCourse}', ${idx}, this.checked)">
            <div class="topic-content">
              <div class="topic-week">${t.week}</div>
              <div class="topic-title">${t.title}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCourse(code) {
      activeCourse = code;
      renderTopics();
    }

    function toggleTopicCard(code, idx) {
      const newState = !checkedState[`${code}_${idx}`];
      toggleTopic(code, idx, newState);
    }

    function toggleTopic(code, idx, val) {
      checkedState[`${code}_${idx}`] = val;
      saveState();
      renderTopics();
    }

    // Başlat
    renderSmartCard();
    renderSchedule();
    renderExams();
    renderTopics();
    updateProgress();
  </script>
</body>
</html>
